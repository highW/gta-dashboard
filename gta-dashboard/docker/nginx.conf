# nginx in the "web" container: the only part of the stack the outside
# world can reach. It serves the built React app and forwards /api/ to the
# load balancer.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1m;

    # Every response, including errors.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's internal DNS. Looking the load balancer up per request (the
    # variable below) means nginx keeps working when that container is
    # restarted and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $lb_upstream http://lb:9000;
        proxy_pass $lb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx is the front door, so it REPLACES X-Forwarded-For with the
        # address that actually connected, instead of adding to whatever the
        # client sent. Otherwise a client could put a fake address in front
        # and the API, which trusts the proxies inside Docker, would believe
        # it. The load balancer then adds nginx's own address after this one.
        proxy_set_header X-Forwarded-For $remote_addr;

        # A little above the load balancer's own 40s limit.
        proxy_read_timeout 45s;
    }

    # Built files have a content hash in their name, so they can be cached
    # for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is a page of the app (/dashboard, /police/records...):
    # serve index.html and let React Router pick the page. Never cached, so
    # a new deploy shows up on the next reload.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
